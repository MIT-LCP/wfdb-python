name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python
        run: uv python install 3.12
      - name: Build documentation
        run: uv run --python 3.12 --only-group docs make -C docs html SPHINXOPTS="-W --keep-going"
