name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install libsndfile
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y libsndfile1
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: uv run --python ${{ matrix.python-version }} --extra dev pytest

  # Make sure the lower bounds of the direct dependencies are actually usable
  test-minimum:
    name: Minimum dependency versions
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Python 3.11
        run: uv python install 3.11
      - name: Install libsndfile
        run: sudo apt-get install -y libsndfile1
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: uv run --python 3.11 --resolution lowest-direct --extra dev pytest
