[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wfdb"
description = "The WFDB Python package: tools for reading, writing, and processing physiologic signals and annotations."
authors = [{name = "The Laboratory for Computational Physiology", email = "contact@physionet.org"}]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "numpy >= 1.26.4",
    "scipy >= 1.13.0",
    "pandas >= 2.2.3",
    "soundfile >= 0.12.1",
    "matplotlib >= 3.8.0",
    "requests >= 2.31.0",
    "fsspec >= 2023.10.0",
    "aiohttp >= 3.10.11",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest >= 8.0.0",
    "pytest-xdist >= 3.5.0",
    "pylint >= 2.13.7",
    "black >= 22.3.0",
    "sphinx >= 7.0.0",
]

[project.urls]
homepage = "https://github.com/MIT-LCP/wfdb-python/"
repository = "https://github.com/MIT-LCP/wfdb-python/"
documentation = "https://wfdb.readthedocs.io/"

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/tests",
    "/sample-data",
    "/demo-img.png",
    "/demo.ipynb",
]

[tool.hatch.version]
path = "wfdb/version.py"
